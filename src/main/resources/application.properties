spring.application.name=orcamento-ai
spring.datasource.url=jdbc:h2:mem:orcamento;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.sql.init.mode=always

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Spring AI
spring.ai.openai.api-key=${OPENAI_API_KEY:demo-key}
spring.ai.openai.chat.options.model=gpt-4o-mini
# For simple local demo and tests, chat model works with placeholder key if no network call is made.
